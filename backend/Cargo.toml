[package]
name = "firewatch-backend"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
axum = { version = "0.8.9", features = ["macros"] }
base64 = "0.22.1"
bincode = "1.3.3"
borsh = "1.6.1"
bs58 = "0.5.1"
chrono = { version = "0.4.44", features = ["serde"] }
dotenvy = "0.15.7"
either = "1.16.0"
flate2 = "1.1.9"
futures = "0.3.32"
hex = "0.4.3"
hmac = "0.12.1"
ab_glyph = "0.2.29"
image = { version = "0.25.8", default-features = false, features = ["png", "jpeg", "webp"] }
reqwest = { version = "0.12.28", default-features = false, features = ["json", "rustls-tls", "gzip", "brotli", "zstd", "deflate"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.10.9"
sbpf-common = "0.1.9"
sbpf-disassembler = "0.1.9"
sqlx = { version = "0.8.6", features = ["runtime-tokio-rustls", "sqlite", "chrono"] }
solana-sdk = "2.3.1"
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["full"] }
tower-http = { version = "0.6.11", features = ["cors", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
uuid = { version = "1.23.1", features = ["v4"] }
yellowstone-grpc-client = "13.1.0"
yellowstone-grpc-proto = { version = "12.4.0", features = ["tonic", "tonic-compression"] }
