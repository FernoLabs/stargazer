name: firewatch-indexers

services:
  firewatch-indexer:
    build:
      context: .
      dockerfile: deploy/dokploy/backend.Dockerfile
      args:
        RUST_VERSION: ${RUST_VERSION:-1.95.0}
    image: ${FIREWATCH_BACKEND_IMAGE:-firewatch-backend:local}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      HTTP_BIND: 0.0.0.0:8080
      DATABASE_URL: sqlite:///data/indexer.db
      BLOB_STORE_DIR: /blobs
    volumes:
      - firewatch-indexer-data:/data
      - firewatch-blob-data:/blobs
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    stop_grace_period: 45s

  firewatch-r2-backup:
    profiles:
      - backup
    build:
      context: .
      dockerfile: deploy/dokploy/backup.Dockerfile
    image: ${FIREWATCH_BACKUP_IMAGE:-firewatch-sqlite-r2-backup:local}
    env_file:
      - .env
    environment:
      DB_PATH: /data/indexer.db
      BACKUP_TMP_DIR: /tmp/firewatch-backups
    volumes:
      - firewatch-indexer-data:/data
      - firewatch-blob-data:/blobs
    restart: "no"

  firewatch-r2-blob-sync:
    profiles:
      - backup
    build:
      context: .
      dockerfile: deploy/dokploy/backup.Dockerfile
    image: ${FIREWATCH_BACKUP_IMAGE:-firewatch-sqlite-r2-backup:local}
    entrypoint: ["/opt/firewatch/bin/sync-blobs-to-r2.sh"]
    env_file:
      - .env
    environment:
      BLOB_STORE_DIR: /blobs
      R2_BLOB_BUCKET: ${R2_BLOB_BUCKET:-firewatch-blobs}
      R2_BLOB_PREFIX: ${R2_BLOB_PREFIX:-blobs}
    volumes:
      - firewatch-blob-data:/blobs:ro
    restart: "no"

  firewatch-cloudflared:
    profiles:
      - tunnel
    image: ${CLOUDFLARED_IMAGE:-cloudflare/cloudflared:latest}
    restart: unless-stopped
    env_file:
      - .env
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      firewatch-indexer:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true

volumes:
  firewatch-indexer-data:
  firewatch-blob-data:
