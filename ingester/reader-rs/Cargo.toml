[package]
name = "stargazer-ledger-reader"
version = "0.1.0"
edition = "2021"
description = "Streaming reader and validator for Stellar Galexie ledger archives"
license = "MIT"

[dependencies]
anyhow = "1.0"
axum = "0.8"
clap = { version = "4.5", features = ["derive", "env"] }
hex = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
stellar-xdr = "27.0.0"
time = { version = "0.3", features = ["formatting", "parsing"] }
tokio = { version = "1.52", features = ["macros", "net", "rt-multi-thread", "signal", "time"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
walkdir = "2.5"
zstd = "0.13"
rusqlite = { version = "0.32", features = ["bundled", "hooks"] }

[dev-dependencies]
http-body-util = "0.1"
tempfile = "3.10"
tower = { version = "0.5", features = ["util"] }
